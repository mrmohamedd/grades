<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجل الدرجات والغياب</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d4e89">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a school register on screen — compact ledger grids, one thumb-reachable bottom nav, ink-blue accent. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#15202c; --muted:#5b6978; --line:#d9e0e8;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#e4edf8;
  --good:#1c7a4b; --good-soft:#e1f3ea; --warn:#a96a10; --warn-soft:#fbefd9; --bad:#c0392b; --bad-soft:#fbe5e2;
  --shade:#eef1f5; --alt:#f7f9fb;
  --font-display:'Cairo','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Cairo',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161d; --surface:#18212b; --ink:#e8eef5; --muted:#9aa9b9; --line:#2b3947;
    --accent:#7db1ee; --accent-ink:#0c1a2b; --accent-soft:#1d3047;
    --good:#58c58c; --good-soft:#173628; --warn:#e4ad5b; --warn-soft:#3a2d14; --bad:#ef8176; --bad-soft:#40201d;
    --shade:#1f2a35; --alt:#1b252f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161d; --surface:#18212b; --ink:#e8eef5; --muted:#9aa9b9; --line:#2b3947;
  --accent:#7db1ee; --accent-ink:#0c1a2b; --accent-soft:#1d3047;
  --good:#58c58c; --good-soft:#173628; --warn:#e4ad5b; --warn-soft:#3a2d14; --bad:#ef8176; --bad-soft:#40201d;
  --shade:#1f2a35; --alt:#1b252f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:820px;margin:0 auto}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;white-space:nowrap}
.top select{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:600}
.top select{min-width:96px}
@media(max-width:480px){.brand{display:none}}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.save.err{color:var(--bad);font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:500}
main{padding:16px 0 120px}
h1,h2,h3{font-family:var(--font-display);margin:0}
h2{font-size:20px;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
nav.bottom{position:fixed;bottom:0;inset-inline:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:820px;margin:0 auto}
nav.bottom button{border:0;background:none;padding:12px 4px;font-weight:600;font-size:14px;color:var(--muted);border-top:3px solid transparent}
nav.bottom button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:14px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--shade);color:var(--muted)}
.badge.exam{background:var(--accent-soft);color:var(--accent)}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.weeks{display:grid;gap:10px}
.week{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.week .no{font-family:var(--font-display);font-weight:700;font-size:22px;min-width:36px;color:var(--accent)}
.week .meta{flex:1;min-width:0}
.week .t{font-weight:600}
.week .d{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-height:calc(100vh - 260px)}
table.g{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.g th,table.g td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.g thead th{position:sticky;top:0;background:var(--shade);z-index:2;font-size:13px;font-weight:600}
table.g td.name,table.g th.name{position:sticky;right:0;background:var(--surface);text-align:start;min-width:132px;max-width:190px;overflow:hidden;text-overflow:ellipsis;z-index:1;border-left:1px solid var(--line)}
table.g thead th.name{background:var(--shade);z-index:3}
table.g td.idx,table.g th.idx{color:var(--muted);font-size:12px;width:28px;padding-inline:4px}
table.g tr:last-child td{border-bottom:0}
.dayh small{display:block;color:var(--muted);font-weight:400}
.abs{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:17px;color:transparent}
.abs[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.att{font-weight:700}
.att.s10{color:var(--good)} .att.s7,.att.s4{color:var(--warn)} .att.s0{color:var(--bad)}
.num{width:64px;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 4px;direction:ltr}
.num.invalid{border-color:var(--bad);background:var(--bad-soft)}
.note{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font-family:var(--font-display);font-size:24px}
.tile span{font-size:13px;color:var(--muted)}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.li{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.li{min-width:0}
.li .nm{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.35}
.li .btn{flex:none}
.li .ix{color:var(--muted);font-size:13px;min-width:24px}
.overlay{position:fixed;inset:0;background:rgba(10,18,28,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center}}
.dlg{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:640px){.dlg{border-radius:18px}}
.dlg h3{font-size:19px;margin-bottom:12px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:84px;inset-inline:16px;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:60;text-align:center;font-size:14px}
.errtxt{color:var(--bad);font-size:14px;margin:4px 0 8px}
.hint{font-size:13px;color:var(--muted)}
.rank{font-weight:700;color:var(--accent)}
td.hl,th.hl{background:var(--accent-soft)!important;font-weight:700}
.sticky-sub{position:sticky;top:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.card{box-shadow:0 1px 2px rgba(15,30,50,.05)}
.btn.primary{box-shadow:0 2px 6px rgba(29,78,137,.25)}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(29,78,137,.22)}
.hero-t{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.3}
.hero-s{opacity:.85;font-size:14px;margin-top:2px}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:10px;margin-top:14px}
.hero-stats div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
.hero-stats b{display:block;font-family:var(--font-display);font-size:20px;line-height:1.2}
.hero-stats span{font-size:12px;opacity:.85}
.week{box-shadow:0 1px 2px rgba(15,30,50,.05)}
.week .no{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--accent-soft);min-width:46px;font-size:20px}
.week.exam .no{background:var(--warn-soft);color:var(--warn)}
.week .meta{display:flex;flex-direction:column;gap:2px}
.week .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.week .side small{font-size:12px;color:var(--muted)}
.prog{display:block;height:6px;border-radius:99px;background:var(--shade);overflow:hidden;margin-top:6px;max-width:220px}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px}
.badge.exam{background:var(--warn-soft);color:var(--warn)}
table.g tbody tr:nth-child(even) td{background:var(--alt)}
table.g tbody tr:nth-child(even) td.name{background:var(--alt)}
.linkbtn{border:0;background:none;padding:0;text-align:start;font-weight:600;color:var(--accent)}
.num::placeholder{color:var(--bad);opacity:.55;font-weight:700}
nav.bottom{box-shadow:0 -2px 12px rgba(15,30,50,.06)}
nav.bottom .in{padding:0 8px}
nav.bottom .navbtn{display:grid;place-items:center;padding:10px 0;border-top:0;border-radius:12px;margin:4px 2px}
nav.bottom .navbtn .ic{display:grid;place-items:center;height:30px}
nav.bottom .navbtn svg{transition:stroke-width .12s}
nav.bottom .navbtn[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
nav.bottom .navbtn[aria-current="true"] svg{stroke-width:2.4;fill:currentColor;fill-opacity:.18}
header.top{box-shadow:0 1px 8px rgba(15,30,50,.05)}
.top select{border-radius:999px;padding:8px 14px}
.iconbtn{border-radius:999px}

table.g thead th{white-space:normal;min-width:78px;line-height:1.35}
table.g thead th.idx,table.g thead th.name{white-space:nowrap}
table.g td.idx,table.g th.idx{position:sticky;right:0;z-index:1;background:var(--surface);width:34px;min-width:34px;max-width:34px;padding-inline:2px}
table.g thead th.idx{background:var(--shade);z-index:3}
table.g td.name,table.g th.name{right:34px}
table.g tbody tr:nth-child(even) td.idx{background:var(--alt)}

@media(max-width:520px){
  table.g th,table.g td{padding:6px 3px}
  table.g td.name,table.g th.name{min-width:104px;max-width:112px;white-space:normal;line-height:1.3;font-size:14px;overflow:visible;text-overflow:clip}
  table.g td.name{padding-inline:6px}
  .abs{width:34px;height:34px;font-size:15px}
  .num{width:58px}
  table.g thead th{min-width:62px;font-size:12px}
  table.g thead th.dayh{min-width:42px}
}
</style>

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>/* Engine: grading calculations + Excel export by patching the user's own template (JSZip + DOM). */
(function (root) {
  'use strict';
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const ABS = 'غ';
  const MAX_WEEKS = 18;
  const ORD = ['الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس', 'السابع', 'الثامن', 'التاسع', 'العاشر',
    'الحادي عشر', 'الثاني عشر', 'الثالث عشر', 'الرابع عشر', 'الخامس عشر', 'السادس عشر', 'السابع عشر', 'الثامن عشر',
    'التاسع عشر', 'العشرون', 'الحادي والعشرون', 'الثاني والعشرون', 'الثالث والعشرون', 'الرابع والعشرون', 'الخامس والعشرون',
    'السادس والعشرون', 'السابع والعشرون', 'الثامن والعشرون', 'التاسع والعشرون', 'الثلاثون'];
  const ordName = n => ORD[n - 1] || String(n);
  const DAYS = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
  const GRADE_SHEETS = ['درجات', 'درجات (2)', 'درجات (3)', 'درجات (4)'];
  const ABS_SHEETS = ['غياب', 'غياب (2)', 'غياب (3)', 'غياب (4)'];
  const FIRST_ROW = 8, MAX_STUDENTS = 50;

  /* ---------- helpers ---------- */
  const isNum = v => typeof v === 'number' && isFinite(v);
  const round2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
  function popcount(n) { let c = 0; n = n | 0; while (n) { c += n & 1; n >>= 1; } return c; }
  function colToNum(s) { let n = 0; for (const ch of s) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }
  function numToCol(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  function parseRef(ref) { const m = /^([A-Z]+)(\d+)$/.exec(ref); return { c: colToNum(m[1]), r: +m[2] }; }
  const q = n => "'" + n + "'";

  /* ---------- dates (weeks always start on a Saturday) ---------- */
  function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  function toISO(d) { return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }
  function addDays(iso, n) { const d = parseISO(iso); d.setUTCDate(d.getUTCDate() + n); return toISO(d); }
  function snapSaturday(iso) { const d = parseISO(iso); const back = (d.getUTCDay() + 1) % 7; d.setUTCDate(d.getUTCDate() - back); return toISO(d); } // Sat=6 -> 0
  function fmtDate(iso) { const d = parseISO(iso); return d.getUTCDate() + '/' + (d.getUTCMonth() + 1) + '/' + d.getUTCFullYear(); }
  // no = the week's own number (1-based): the teacher may start the sheet at any week, e.g. the 5th
  function weekLabel(no, iso) { return 'الاسبـوع ' + ordName(no) + (iso ? ' ' + fmtDate(iso) : ''); }
  function weekNos(weeks, n) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const w = weeks[i];
      out.push(w && isNum(+w.no) && w.no > 0 ? +w.no : (i === 0 ? 1 : out[i - 1] + 1));
    }
    return out;
  }
  function dayNumbers(iso) { return [0, 1, 2, 3, 4, 5].map(k => parseISO(addDays(iso, k)).getUTCDate()); }

  /* ---------- grading rules ---------- */
  // attendance: 10 per week; 1st absence -3, 2nd another -3, 3rd (or more) -> 0
  function attScore(absCount) { return [10, 7, 4, 0][Math.min(absCount, 3)]; }
  function weekAbsCount(week, sid) { return popcount((week.abs && week.abs[sid]) || 0); }
  function avgOf(list) { const a = list.filter(isNum); return a.length ? round2(a.reduce((x, y) => x + y, 0) / a.length) : null; }
  const numOrNull = v => (v === '' || v == null || !isFinite(+v)) ? null : +v;

  function computeStudent(cls, sid) {
    const weeks = cls.weeks.map(w => {
      const weekly = numOrNull(w.score && w.score[sid]);
      const hw = numOrNull(w.hw && w.hw[sid]);
      const abs = weekAbsCount(w, sid);
      if (w.type === 'exam') return { type: 'exam', weekly: null, hw: null, abs, att: null, total: null }; // exam week: no grades at all
      const att = attScore(abs);
      const parts = [weekly, hw, att].filter(isNum);
      return { type: w.type, weekly, hw, abs, att, total: parts.length ? parts.reduce((a, b) => a + b, 0) : null };
    });
    const normal = weeks.filter(w => w.type !== 'exam');
    const aW = avgOf(normal.map(w => w.weekly)), aH = avgOf(normal.map(w => w.hw)), aA = avgOf(normal.map(w => w.att));
    const parts = [aW, aH, aA].filter(isNum);
    const semTotal = parts.length ? round2(parts.reduce((a, b) => a + b, 0)) : null;
    const exams = (cls.exams || []).map(e => numOrNull(e.scores && e.scores[sid]));
    const examAvg = exams.length >= 2 ? avgOf(exams) : (exams.length === 1 ? exams[0] : null);
    const totalAbs = weeks.reduce((a, w) => a + w.abs, 0);
    const grand = (semTotal == null && examAvg == null) ? null : round2((semTotal || 0) + (examAvg || 0));
    return { weeks, aW, aH, aA, semTotal, exams, examAvg, totalAbs, grand };
  }

  /* ---------- XML patching ---------- */
  function mkSheet(doc) {
    const sd = doc.getElementsByTagName('sheetData')[0];
    const rows = new Map();
    for (const row of Array.from(sd.childNodes)) if (row.nodeType === 1 && row.nodeName === 'row') rows.set(+row.getAttribute('r'), row);
    function getRow(r, create) {
      if (rows.has(r)) return rows.get(r);
      if (!create) return null;
      const el = doc.createElementNS(NS, 'row'); el.setAttribute('r', String(r));
      let before = null;
      for (const [k, v] of rows) if (k > r && (!before || k < +before.getAttribute('r'))) before = v;
      sd.insertBefore(el, before); rows.set(r, el); return el;
    }
    function getCell(ref, create) {
      const { c, r } = parseRef(ref);
      const row = getRow(r, create); if (!row) return null;
      let before = null;
      for (const cell of Array.from(row.childNodes)) {
        if (cell.nodeType !== 1) continue;
        const cc = parseRef(cell.getAttribute('r')).c;
        if (cc === c) return cell;
        if (cc > c) { before = cell; break; }
      }
      if (!create) return null;
      const el = doc.createElementNS(NS, 'c'); el.setAttribute('r', ref);
      row.insertBefore(el, before); return el;
    }
    function clear(cell) { while (cell.firstChild) cell.removeChild(cell.firstChild); cell.removeAttribute('t'); }
    function text(cell, s) {
      clear(cell); cell.setAttribute('t', 'inlineStr');
      const is = doc.createElementNS(NS, 'is'), t = doc.createElementNS(NS, 't');
      t.setAttribute('xml:space', 'preserve'); t.appendChild(doc.createTextNode(s)); is.appendChild(t); cell.appendChild(is);
    }
    function num(cell, n) { clear(cell); cell.setAttribute('t', 'n'); const v = doc.createElementNS(NS, 'v'); v.appendChild(doc.createTextNode(String(n))); cell.appendChild(v); }
    function formula(cell, f, cached) {
      clear(cell);
      const fe = doc.createElementNS(NS, 'f'); fe.appendChild(doc.createTextNode(f)); cell.appendChild(fe);
      const v = doc.createElementNS(NS, 'v');
      if (isNum(cached)) { cell.setAttribute('t', 'n'); v.appendChild(doc.createTextNode(String(cached))); }
      else { cell.setAttribute('t', 'str'); }
      cell.appendChild(v);
    }
    return {
      doc,
      style(ref) { const c = getCell(ref, false); return c ? c.getAttribute('s') : null; },
      set(ref, val, opts) {

      fixCount() { const mc = doc.getElementsByTagName('mergeCells')[0]; mc.setAttribute('count', String(mc.getElementsByTagName('mergeCell').length)); },

  function replaceDots(str, re, rep) { return str.replace(re, rep); }

  /* ---------- build the workbook ---------- */
  // opts: { JSZip, DOMParser, XMLSerializer, templateBytes (ArrayBuffer|Uint8Array|base64 string) }
  async function buildWorkbook(model, opts) {
    const { JSZip, DOMParser, XMLSerializer } = opts;
    const zip = await JSZip.loadAsync(opts.templateBytes, typeof opts.templateBytes === 'string' ? { base64: true } : undefined);
    const parse = async p => new DOMParser().parseFromString(await zip.file(p).async('string'), 'application/xml');
    const ser = d => new XMLSerializer().serializeToString(d);

    const wbDoc = await parse('xl/workbook.xml');
    const relDoc = await parse('xl/_rels/workbook.xml.rels');
    const relMap = {};
    for (const r of Array.from(relDoc.getElementsByTagName('Relationship'))) relMap[r.getAttribute('Id')] = r.getAttribute('Target').replace(/^\//, '').replace(/^(?!xl\/)/, 'xl/');
    const sheetPath = {};
    for (const s of Array.from(wbDoc.getElementsByTagName('sheet'))) sheetPath[s.getAttribute('name')] = relMap[s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id') || s.getAttribute('r:id')];

    const sheets = {};
    async function S(name) { if (!sheets[name]) sheets[name] = mkSheet(await parse(sheetPath[name])); return sheets[name]; }

    const st = model.settings, cls = model.cls;
    const students = cls.students.slice(0, MAX_STUDENTS);
    const weeks = cls.weeks.slice(0, MAX_WEEKS);
    const rowOf = i => FIRST_ROW + i;
    const calc = students.map(s => computeStudent({ weeks, exams: cls.exams || [] }, s.id));
    const className = (cls.name || '').trim();

    /* ----- common header for the 8 record sheets ----- */
    const isGrade = n => n.startsWith('درجات');
    for (const name of [...GRADE_SHEETS, ...ABS_SHEETS]) {
      const sh = await S(name);
      sh.resetView();
      sh.set('A2', 'إدارة ' + (st.edara || ''));
      sh.set('A3', 'مدرسة ' + (st.school || ''));
      for (let i = 0; i < MAX_STUDENTS; i++) {
        if (students[i]) sh.set('B' + rowOf(i), students[i].name, { s: '168' }); // same name style on every row (template mixes sizes)
        else sh.set('B' + rowOf(i), null);
      }
      if (isGrade(name)) {
        sh.set('B4', 'سجل رصد درجات فصل ' + className);
        sh.set('G4', null);
        sh.set('K4', st.subject || '');
      } else {
        sh.set('C4', 'سجل رصد غياب فصل ' + className);
        sh.set('I4', null);
        sh.set('M4', st.subject || '');
      }
    }

    /* ----- per-week blocks ----- */
    const weekLoc = w => ({ page: Math.floor(w / 5), k: w % 5 }); // 5 weeks per page
    const gradeCols = k => ({ w: numToCol(3 + 4 * k), h: numToCol(4 + 4 * k), a: numToCol(5 + 4 * k), t: numToCol(6 + 4 * k) });
    const absCols = k => { const a = 3 + 6 * k; return { first: numToCol(a), last: numToCol(a + 5), day: d => numToCol(a + d) }; };

    const nos = weekNos(weeks, MAX_WEEKS);
    for (let w = 0; w < MAX_WEEKS; w++) {
      const { page, k } = weekLoc(w);
      const g = await S(GRADE_SHEETS[page]), a = await S(ABS_SHEETS[page]);
      const wk = weeks[w];
      const gc = gradeCols(k), ac = absCols(k);
      g.set(gc.w + '5', weekLabel(nos[w], wk && wk.start));
      a.set(ac.first + '5', weekLabel(nos[w], wk && wk.start));
      if (!wk) continue;
      dayNumbers(wk.start).forEach((n, d) => a.set(ac.day(d) + '7', n));
      students.forEach((s, i) => {
        const r = rowOf(i), cw = calc[i].weeks[w];
        for (let d = 0; d < 6; d++) if (((wk.abs && wk.abs[s.id]) || 0) & (1 << d)) a.set(ac.day(d) + r, ABS);
        if (wk.type === 'exam') return;                 // exam week: every grade cell stays empty
        g.set(gc.w + r, cw.weekly != null ? cw.weekly : ABS);   // not entered = absent (غ), a typed 0 stays 0
        g.set(gc.h + r, cw.hw != null ? cw.hw : ABS);
        const absRange = q(ABS_SHEETS[page]) + '!' + ac.first + r + ':' + ac.last + r;
        g.set(gc.a + r, { f: 'CHOOSE(MIN(COUNTIF(' + absRange + ',"' + ABS + '"),3)+1,10,7,4,0)', v: cw.att });
        g.set(gc.t + r, { f: 'IF(COUNT(' + gc.w + r + ':' + gc.a + r + ')=0,"",SUM(' + gc.w + r + ':' + gc.a + r + '))', v: cw.total });
      });
    }

    /* ----- total absences column on the last attendance page (U) ----- */
    {
      const a4 = await S(ABS_SHEETS[3]);
      students.forEach((s, i) => {
        const r = rowOf(i);
        const parts = [
          q(ABS_SHEETS[0]) + '!C' + r + ':AF' + r, q(ABS_SHEETS[1]) + '!C' + r + ':AF' + r,
          q(ABS_SHEETS[2]) + '!C' + r + ':AF' + r, q(ABS_SHEETS[3]) + '!C' + r + ':T' + r];
        a4.set('U' + r, { f: parts.map(p => 'COUNTIF(' + p + ',"' + ABS + '")').join('+'), v: calc[i].totalAbs });
      });
    }

    /* ----- semester average (O:R) on the last grade page: normal weeks only ----- */
    {
      const g4 = await S(GRADE_SHEETS[3]);
      const normalIdx = weeks.map((w, i) => w.type === 'exam' ? -1 : i).filter(i => i >= 0);
      const ref = (col, idx, r) => { const { page, k } = weekLoc(idx); return q(GRADE_SHEETS[page]) + '!' + gradeCols(k)[col] + r; };
      g4.set('O5', 'متوسط الفصل الدراسى ' + (st.semester || 'الأول'));
      students.forEach((s, i) => {
        if (!normalIdx.length) return;
        const r = rowOf(i), c = calc[i];
        const avgF = (col) => 'IFERROR(ROUND(AVERAGE(' + normalIdx.map(ix => ref(col, ix, r)).join(',') + '),2),"")';
        g4.set('O' + r, { f: avgF('w'), v: c.aW });
        g4.set('P' + r, { f: avgF('h'), v: c.aH });
        g4.set('Q' + r, { f: avgF('a'), v: c.aA });
        g4.set('R' + r, { f: 'IF(COUNT(O' + r + ':Q' + r + ')=0,"",ROUND(SUM(O' + r + ':Q' + r + '),2))', v: c.semTotal });
      });

      /* ----- monthly / important exams (S..): n exams + average + notes ----- */
      const exams = (cls.exams || []).slice(0, 4);
      const n = Math.max(exams.length, 2);
      const maxE = isNum(+cls.examMax) && +cls.examMax > 0 ? +cls.examMax : 15;
      const tot = n + 1 + 1;              // exams + average + notes
      const lastCol = 18 + tot;           // S = 19
      // capture template styles (S=first, T=mid, U=avg, V=notes) for every row before changing anything
      const roleStyle = {};
      for (let r = 5; r <= 57; r++) roleStyle[r] = { first: g4.style('S' + r), mid: g4.style('T' + r), avg: g4.style('U' + r), notes: g4.style('V' + r) };
      g4.unmerge('S5:V5');
      const roles = [];
      for (let ci = 0; ci < tot; ci++) roles.push(ci < n ? (ci === 0 ? 'first' : 'mid') : (ci === n ? 'avg' : 'notes'));
      for (let r = 5; r <= 57; r++) roles.forEach((role, ci) => {
        const ref = numToCol(19 + ci) + r, cell = g4.set(ref, null, { s: roleStyle[r][role] });
      });
      g4.merge('S5:' + numToCol(lastCol) + '5');
      g4.set('S5', 'اختبارات الشهور');
      const avgName = n === 2 ? 'متوسط الاختبارين' : n === 3 ? 'متوسط الاختبارات الثلاثة' : 'متوسط الاختبارات الأربعة';
      for (let ci = 0; ci < n; ci++) {
        const col = numToCol(19 + ci);
        g4.set(col + '6', exams[ci] ? exams[ci].name : 'اختبار');
        g4.set(col + '7', maxE);
      }
      const avgCol = numToCol(19 + n), notesCol = numToCol(19 + n + 1);
      g4.set(avgCol + '6', avgName); g4.set(avgCol + '7', maxE);
      g4.set(notesCol + '6', 'ملاحظات');
      students.forEach((s, i) => {
        const r = rowOf(i), c = calc[i];
        exams.forEach((e, ci) => { if (c.exams[ci] != null) g4.set(numToCol(19 + ci) + r, c.exams[ci]); });
        if (exams.length >= 1) {
          const rng = 'S' + r + ':' + numToCol(18 + n) + r;
          g4.set(avgCol + r, { f: 'IFERROR(ROUND(AVERAGE(' + rng + '),2),"")', v: c.examAvg });
        }
      });
      if (lastCol > 22) {
        for (let cn = 23; cn <= lastCol; cn++) g4.widen(23, 24, 10.625);
        sheets.__printLast = numToCol(lastCol);
      }
    }

    /* ----- opening / closing minutes ----- */
    {
      const fatha = await S('محضر فتح'), ghalq = await S('محضر غلق');
      fatha.set('A2', '       محافظة ' + (st.gov || ''));
      fatha.set('A3', '               إدارة ' + (st.edara || ''));
      fatha.set('B4', 'مدرسة / ' + (st.school || ''));
      fatha.set('A17', fatha.getText('A17').replace(/(لمادة\s*)[.…]+/, '$1' + (st.subject || '..................')));
      ghalq.set('A2', '    محافظة ' + (st.gov || '…………'));
      ghalq.set('A3', 'إدارة ' + (st.edara || '…………………'));
      ghalq.set('A5', 'مدرسة / ' + (st.school || '....................'));
      let a15 = ghalq.getText('A15');
      a15 = a15.replace(/(أقر انا\s*\/\s*)[.…]+/, '$1' + (st.teacher || '...................'))
        .replace(/(معلم مادة\s*\/\s*)[.…]+/, '$1' + (st.subject || '...........'))
        .replace(/(فصل\s*\/\s*)[.…]+/, '$1' + (className || '.........'));
      ghalq.set('A15', a15);
      let a16 = ghalq.getText('A16');
      a16 = a16.replace(/(للفصل الدراسى\s*)[.…]+/, '$1' + (st.semester || '.......')).replace(/(للعام الدراسى\s*)\d{4}\s*\/\s*\d{4}/, '$1' + (st.year || '.......'));
      ghalq.set('A16', a16);
    }

    /* ----- write back ----- */
    for (const name of Object.keys(sheets)) if (name !== '__printLast') zip.file(sheetPath[name], ser(sheets[name].doc));
    if (sheets.__printLast) {
      for (const dn of Array.from(wbDoc.getElementsByTagName('definedName')))
        if (dn.textContent.indexOf(q(GRADE_SHEETS[3])) === 0) dn.textContent = dn.textContent.replace(/\$V\$/, '$' + sheets.__printLast + '$');

    const wbRoot = wbDoc.documentElement;

  }

const DIRTYK = () => 'sijil:'+S.uid+':__dirty';
const getDirty = () => { try{ return JSON.parse(localStorage.getItem(DIRTYK())||'[]'); }catch(e){ return []; } };
const setDirty = arr => { try{ localStorage.setItem(DIRTYK(), JSON.stringify(arr)); }catch(e){} };
const lget = key => { try{ const t=localStorage.getItem(LSK(key)); return t?JSON.parse(t):null; }catch(e){ return null; } };
const withTimeout = (p,ms) => Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('timeout'),{code:'timeout'})),ms))]);
async function readDoc(key){
  const local = lget(key);
  if (getDirty().includes(key) && local) return local;
  if (!navigator.onLine){ if (local) return local; throw new Error('offline-nocache'); }
  try{
    const snap = await withTimeout(docRef(key).get({source:'server'}), 8000);
    const d = snap.exists ? snap.data() : null;
    if (d){ try{ localStorage.setItem(LSK(key), JSON.stringify(d)); }catch(e){} }
    return d;
  }catch(e){
    if (e && e.code==='permission-denied') throw e;
    if (local) return local;
    throw e;
  }
}
async function writeDoc(key, data){
  const clean = JSON.parse(JSON.stringify(data));
  const str = JSON.stringify(clean);
  try{ localStorage.setItem(LSK(key), str); }catch(e){}
  const dirty=getDirty(); if(!dirty.includes(key)){ dirty.push(key); setDirty(dirty); }
  await withTimeout(docRef(key).set(clean), 10000);
  if (localStorage.getItem(LSK(key))===str){ setDirty(getDirty().filter(k=>k!==key)); }
}
async function deleteDoc(key){
  try{ localStorage.removeItem(LSK(key)); }catch(e){}
  setDirty(getDirty().filter(k=>k!==key));
  await withTimeout(docRef(key).delete(), 10000);
}
let syncing=false, syncTimer=null;
async function syncDirty(){
  if (!S.uid || syncing || !navigator.onLine) return;
  syncing=true;
  try{
    for (const key of getDirty().slice()){ const d=lget(key); if(d) await writeDoc(key,d); else setDirty(getDirty().filter(k=>k!==key)); }
    if (!getDirty().length && !Object.keys(pending).length) setSave('saved');
  }catch(e){ scheduleSync(); }
  syncing=false;
}
function scheduleSync(){ clearTimeout(syncTimer); syncTimer=setTimeout(syncDirty,15000); }
window.addEventListener('online',()=>{ syncDirty(); });
function setSave(s){ S.save=s; const el=document.getElementById('savestate'); if (el){ el.textContent = s==='saving'?'جاري الحفظ…':s==='saved'?'تم الحفظ':s==='error'?'تعذّر الحفظ':s==='offline'?'محفوظ على الجهاز':''; el.className='save'+(s==='error'?' err':''); } }
function queue(key, data){ pending[key]=data; setSave('saving'); clearTimeout(timer); timer=setTimeout(flush,600); }
async function flush(){
  if (flushing) return; flushing=true;
  try{
    for (const key of Object.keys(pending)){ const d=pending[key]; delete pending[key]; await writeDoc(key,d); }
    setSave('saved');
  }catch(e){ setSave(e&&e.code==='permission-denied'?'error':'offline'); scheduleSync(); }
  flushing=false;
  if (Object.keys(pending).length) flush();
}

async function loadClass(id){
  if (clsCache[id]) return clsCache[id];
  const d = await readDoc('c_'+id);
  const c = d || { name:(S.app.classes.find(x=>x.id===id)||{}).name||'', students:[], weeks:[], exams:[], examMax:15, nextSid:1 };
  c.students=c.students||[]; c.weeks=c.weeks||[]; c.exams=c.exams||[]; c.examMax=c.examMax||15; c.nextSid=c.nextSid||(c.students.length+1);
  clsCache[id]=c; return c;
}

async function startApp(user){
  S.uid=user.uid; S.loaded=false; render();
  try{
    const a = await readDoc('app');
    if (a){ S.app = { settings:{...DEFAULT_SETTINGS,...(a.settings||{})}, classes:a.classes||[], activeId:a.activeId||null }; }
    if (S.app.activeId && !S.app.classes.find(c=>c.id===S.app.activeId)) S.app.activeId = S.app.classes[0] ? S.app.classes[0].id : null;
    if (!S.app.activeId && S.app.classes[0]) S.app.activeId=S.app.classes[0].id;
    if (S.app.activeId) S.cls = await loadClass(S.app.activeId);
  }catch(e){ S.fail=true; }
  S.loaded=true; render();
  if (!S.fail){ syncDirty(); (async()=>{ for (const c of S.app.classes){ try{ await loadClass(c.id); }catch(e){} } })(); }
}
function boot(){
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{}); }catch(e){}
  initStore();
  AUTH.onAuthStateChanged(user=>{
    if (user){ if (S.uid!==user.uid || !S.loaded) startApp(user); }
    else { S.uid=null; S.fail=false; S.loaded=false; S.cls=null; for(const k in clsCache) delete clsCache[k]; S.app={settings:{...DEFAULT_SETTINGS},classes:[],activeId:null}; loginScreen(); }
  });
}

function numInput(max, value, onValid, col, row, ph){
  const inp = h('input',{class:'num',type:'text',inputmode:'decimal',enterkeyhint:'next',autocomplete:'off',placeholder:ph||null,value:value==null?'':String(value),'data-col':col,'data-row':row,'aria-label':'درجة'});
  inp.addEventListener('input',()=>{
    const t = normDigits(inp.value);
    if (t===''){ inp.classList.remove('invalid'); inp.title=''; onValid(null); return; }
    const n = Number(t);
    if (isFinite(n) && n>=0 && n<=max){ inp.classList.remove('invalid'); inp.title=''; onValid(n); }
    else { inp.classList.add('invalid'); inp.title='الدرجة لازم تكون بين 0 و '+max; }
  });
  inp.addEventListener('keydown',e=>{
    if (e.key==='Enter'){ e.preventDefault(); const next=document.querySelector('input[data-col="'+col+'"][data-row="'+(row+1)+'"]'); if(next){ next.focus(); next.select(); } else inp.blur(); }
  });
  inp.addEventListener('focus',()=>inp.select());
  return inp;
}

function weekStats(w){
  let abs=0, scored=0; const n=students().length;
  for (const s of students()){ abs += E.popcount((w.abs&&w.abs[s.id])||0); if (w.score && w.score[s.id]!=null) scored++; }
  return {abs,scored,n};
}

function weekFields(defDate, defNo){
  const date=h('input',{type:'date',id:'wdate',value:defDate});
  const noIn=h('input',{type:'text',inputmode:'numeric',id:'wno',value:String(defNo),maxlength:3});
  const prev=h('span',{class:'hint'},'');
  const upd=()=>{ const n=parseInt(normDigits(noIn.value),10); prev.textContent=n>0?'الاسم في السجل: الأسبوع '+E.ordName(n):''; };
  noIn.addEventListener('input',upd); upd();
  const nodes=[h('div',{class:'field'},h('label',{for:'wno'},'رقم الأسبوع'),noIn,prev),
    h('div',{class:'field'},h('label',{for:'wdate'},'تاريخ بداية الأسبوع (السبت)'),date,h('span',{class:'hint'},'لو اخترت يوم تاني هيتحول لسبت نفس الأسبوع.'))];
  const read=(err,self)=>{
    const n=parseInt(normDigits(noIn.value),10);
    if(!(n>=1&&n<=60)){ err.textContent='اكتب رقم الأسبوع (من 1 إلى 60).'; err.hidden=false; return null; }
    if(!date.value){ err.textContent='اختر التاريخ.'; err.hidden=false; return null; }
    const start=E.snapSaturday(date.value);

  return h('div',null,h('h2',null,'تصدير Excel'),h('p',{class:'sub'},'فصل '+c.name+' · '+st.subject),
    h('div',{class:'card'},
      h('p',{style:'margin-top:0'},'الملف بنفس شكل السجل الورقي: كل 5 أسابيع في ورقة غياب وورقة درجات، وآخر ورقة فيها متوسط الفصل واختبارات الشهور، ومعاهم الغلاف ومحضر الفتح ومحضر الغلق. الخانة اللي ما اتسجلتش فيها درجة بتطلع «غ»، وأسبوع الامتحان بيطلع بخاناته فاضية.'),
      h('div',{class:'tiles'},h('div',{class:'tile'},h('b',null,c.students.length),h('span',null,'طالب')),h('div',{class:'tile'},h('b',null,c.weeks.length),h('span',null,'أسبوع')),h('div',{class:'tile'},h('b',null,c.exams.length),h('span',null,'اختبار'))),
      !c.weeks.length&&c.students.length?h('div',{class:'note'},'لسه ما سجلتش أسابيع، فالملف هيطلع بالأسماء والرؤوس فقط.'):null,
      btn,h('div',{id:'xmsg',class:'hint',style:'margin-top:8px'},'')),
    h('div',{class:'card'},h('h3',{style:'font-size:17px;margin-bottom:6px'},'نسخة احتياطية'),h('p',{class:'sub'},'بيانات الفصل بتتحفظ تلقائيًا. تقدر كمان تنزّل نسخة JSON تحتفظ بها أو ترجّعها.'),
      h('div',{class:'bar'},h('button',{class:'btn',onclick:backup},'تنزيل نسخة احتياطية'),h('button',{class:'btn',onclick:()=>file.click()},'استرجاع نسخة'),file)),
    h('div',{class:'card'},h('h3',{style:'font-size:17px;margin-bottom:6px'},'نسخة احتياطية لكل الفصول'),h('p',{class:'sub'},'ملف واحد فيه كل الفصول وبيانات المدرسة. احتفظ بيه على Drive أو واتساب.'),
      h('div',{class:'bar'},h('button',{class:'btn primary',onclick:backupAll},'تنزيل نسخة كاملة'),h('button',{class:'btn',onclick:()=>fileAll.click()},'استرجاع نسخة كاملة'),fileAll),h('div',{id:'bmsg',class:'hint'},'')),
    h('p',{class:'hint'},S.store==='cloud'?'البيانات محفوظة في حسابك وتظهر على أي جهاز تفتح منه الصفحة بنفس الحساب.':'تنبيه: البيانات محفوظة في هذا المتصفح فقط. نزّل نسخة احتياطية بانتظام.'));
}
async function saveFile(filename, data, mime){
  const blob=new Blob([data],{type:mime});
    const url=URL.createObjectURL(blob); const a=h('a',{href:url,download:filename}); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),30000);
}
const safeName = s => s.replace(/[\\/:*?"<>|]+/g,'-').trim();
async function doExport(){
  const btn=document.getElementById('xbtn'), msg=document.getElementById('xmsg');
  btn.disabled=true; btn.textContent='جاري تجهيز الملف…';
  try{
    const bytes=await E.buildWorkbook({settings:S.app.settings,cls:S.cls},{JSZip,DOMParser,XMLSerializer,templateBytes:TEMPLATE_B64});
    await saveFile(safeName('سجل '+S.cls.name+' - '+S.app.settings.subject)+'.xlsx',bytes,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    msg.textContent='تم تجهيز الملف.';
  }catch(e){
    if (e&&e.code==='declined'){ msg.textContent=''; }
    else { msg.textContent='تعذّر إنشاء الملف. حاول مرة تانية.'; msg.style.color='var(--bad)'; }
  }
  btn.disabled=false; btn.textContent='تحميل ملف Excel';
}
async function backup(){
  try{ await saveFile(safeName('نسخة '+S.cls.name)+'.json',JSON.stringify(S.cls),'application/json'); }catch(e){ if(!(e&&e.code==='declined')) toast('تعذّر تنزيل النسخة'); }
}

async function backupAll(){
  const msg=document.getElementById('bmsg'); if(msg) msg.textContent='جاري التجهيز…';
  try{
    try{ if(Object.keys(pending).length) await flush(); }catch(e){}
    const classes={};
    for (const c of S.app.classes){ classes[c.id]=await loadClass(c.id); }
    const d={kind:'sijil-all',version:1,date:new Date().toISOString(),app:S.app,classes};
    await saveFile('نسخة كاملة - سجل الدرجات - '+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(d),'application/json');
    if(msg) msg.textContent='تم تنزيل النسخة ('+S.app.classes.length+' فصل).';
  }catch(e){ if(msg) msg.textContent='تعذّر تجهيز النسخة.'; }
}
async function restoreAll(d){
  try{
    const old=S.app.classes.map(c=>c.id);
    for (const id of Object.keys(d.classes)) await writeDoc('c_'+id,d.classes[id]);
    S.app={settings:{...DEFAULT_SETTINGS,...(d.app.settings||{})},classes:d.app.classes||[],activeId:d.app.activeId||null};
    if(!S.app.classes.find(c=>c.id===S.app.activeId)) S.app.activeId=S.app.classes[0]?S.app.classes[0].id:null;
    for (const k in clsCache) delete clsCache[k];
    await writeDoc('app',S.app);
    for (const id of old){ if(!d.classes[id]){ try{ await deleteDoc('c_'+id); }catch(e){} } }
    S.cls=S.app.activeId?await loadClass(S.app.activeId):null; S.weekIdx=null; render(); toast('تم استرجاع النسخة الكاملة');
  }catch(e){ toast('تعذّر الاسترجاع. حاول مرة تانية.'); }
}

boot();
</script>
